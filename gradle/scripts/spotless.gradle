// Spotless auto-formatter
// See https://github.com/diffplug/spotless/tree/main/plugin-gradle
// Can be locally toggled via spotless:off/spotless:on comments
spotless {
    encoding 'UTF-8'

    format 'misc', {
        target '.gitattributes', '.gitignore', '*.md'

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }

    groovyGradle {
        target '*.gradle', 'gradle/**/*.gradle'

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }

    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

        def orderFile = file("$rootDir/gradle/spotless/spotless.importorder")
        def formatFile = file("$rootDir/gradle/spotless/spotless.eclipseformat.xml")

        toggleOffOn()
        importOrderFile(orderFile)
        removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
        trimTrailingWhitespace()
        leadingSpacesToTabs()
        endWithNewline()
        eclipse('4.31').configFile(formatFile)
    }

    json {
        target 'src/*/resources/**/*.json', 'src/*/resources/**/*.mcmeta'
        targetExclude 'src/generated/resources/**'

        biome()
        trimTrailingWhitespace()
        leadingSpacesToTabs()
        endWithNewline()
    }
}
